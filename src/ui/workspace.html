<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>truemap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Cpath d=%27M10 2.2 15.6 17.6 10 14.4 4.4 17.6z%27 fill=%27%23fff%27 stroke=%27%2317202b%27 stroke-width=%271.5%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M10 2.2V14.4L4.4 17.6z%27 fill=%27%23141413%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/__truemap/tokens.css" id="tokensCss">
<link rel="stylesheet" href="/__truemap/workspace.css">
<script>window.TRUEMAP_TOKEN = "__TRUEMAP_TOKEN__"; window.TRUEMAP_CONTENT = "__TRUEMAP_CONTENT__";</script>
</head>
<body>
<div class="app" id="app" data-conn="live">

  <header class="bar">
    <div class="projects">
      <button class="brand" id="projBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Projects">
        <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><path class="mark-line" d="M10 2.2 15.6 17.6 10 14.4 4.4 17.6z"/><path class="mark-fill" d="M10 2.2V14.4L4.4 17.6z"/></svg>
        <span class="wordmark" id="projName">truemap</span>
        <span class="proj-n" id="projCount" hidden></span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
      </button>
      <div class="menu proj-menu" id="projMenu" role="menu" hidden></div>
    </div>
    <span class="slash" aria-hidden="true">/</span>
    <span class="nav-btns"><button class="icon-btn nav" id="navBack" type="button" title="Back (Alt+Left)" aria-label="Back" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button><button class="icon-btn nav" id="navFwd" type="button" title="Forward (Alt+Right)" aria-label="Forward" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button></span>
    <button class="map-btn" id="crumbHome" type="button" title="The map of the whole system"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="3.5" rx="1"/><rect x="2" y="7.5" width="5" height="6" rx="1"/><rect x="9" y="7.5" width="5" height="6" rx="1"/></svg>Map</button>
    <span class="crumb-sep" id="crumbSep" aria-hidden="true" hidden></span>
    <div class="switcher">
      <button class="page-btn" id="pageBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Pages (Ctrl+K)">
        <span class="page-name" id="pageTitle">No pages yet</span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <div class="menu-head"><span id="project"></span><input id="filter" type="search" placeholder="Find a page" autocomplete="off" hidden></div>
        <div class="menu-list" id="pages"></div>
        <div class="menu-foot"><button class="text-btn" id="recheck" type="button">Check pages against the code</button><span id="ver"></span></div>
      </div>
    </div>
    <span class="spacer"></span>
    <button class="check" id="checkChip" type="button" hidden><i aria-hidden="true"></i><span id="checkText"></span></button>
    <button class="icon-btn" id="togglePanel" type="button" aria-pressed="true" aria-controls="panel" title="Hide conversation">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2"/><path d="M12.25 3.75v12.5"/><path class="panel-fill" d="M12.25 4.5h4.25v11h-4.25z"/></svg>
      <span class="unread" id="unread" hidden></span>
    </button>
    <div class="more">
      <button class="icon-btn" id="moreBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More" title="More">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle class="dot" cx="10" cy="4.5" r="1.4"/><circle class="dot" cx="10" cy="10" r="1.4"/><circle class="dot" cx="10" cy="15.5" r="1.4"/></svg>
      </button>
      <div class="menu more-menu" id="moreMenu" role="menu" hidden>
        <div class="more-file"><span class="more-label">This page</span><div class="more-path"><code id="moreFile">No page open</code><button class="text-btn" id="copyPath" type="button">Copy path</button></div></div>
        <button class="more-item" id="exportPage" type="button" role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v9M6 9l4 4 4-4M4 16.5h12"/></svg><span>Export as one HTML file<small>To share it; opens without truemap</small></span></button>
        <div class="more-theme"><span>Appearance</span><span class="seg" id="themeSeg" role="group" aria-label="Appearance"><button type="button" data-theme-pick="">System</button><button type="button" data-theme-pick="light">Light</button><button type="button" data-theme-pick="dark">Dark</button></span></div>
        <div class="menu-gap"></div>
        <button class="more-item" id="endConv" type="button" role="menuitem"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4.5H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3M12.5 6.5 16 10l-3.5 3.5M16 10H8"/></svg><span>End conversation<small id="endHint">Lets the agent go back to the terminal</small></span></button>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="planbar" id="planbar" hidden></div>
    <div class="lit-pill" id="litPill" hidden><span id="litText"></span><button type="button" id="litClear">Show all</button></div>
    <iframe id="frame" title="Page" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
    <section class="empty" id="empty" hidden>
      <svg class="empty-mark" viewBox="0 0 20 20" aria-hidden="true"><path class="mark-line" d="M10 2.2 15.6 17.6 10 14.4 4.4 17.6z"/><path class="mark-fill" d="M10 2.2V14.4L4.4 17.6z"/></svg>
      <h1>No map of this project yet</h1>
      <p>Ask the agent to read the code and draw the blueprint. Every box on it points to real code, and truemap tells you when the code moves on.</p>
      <button class="primary" id="drawBlueprint" type="button">Ask the agent for a blueprint</button>
    </section>
  </main>

  <aside class="panel" id="panel" aria-label="Conversation">
    <section class="inspector" id="inspector" aria-label="What this box is">
      <div class="insp-head"><button class="insp-back" id="inspBack" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>Conversation</button></div>
      <div class="insp-body" id="inspBody"></div>
    </section>
    <div class="convo">
    <div class="panel-head">
      <div class="ptabs" role="tablist" hidden>
        <button class="ptab" id="tabConvo" type="button" role="tab" aria-selected="true" title="Talk with the agent working in your terminal">Conversation</button>
        <button class="ptab" id="tabChanges" type="button" role="tab" aria-selected="false" title="What changed in the code, shown on the map box by box">Changes<span class="ptab-n" id="changesCount" hidden></span></button>
      </div>
      <span class="agent-state" id="agent" data-state="offline"><i aria-hidden="true"></i><span id="agentLabel">Not listening</span><span class="elapsed" id="elapsed" hidden></span></span>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="changes" id="changes" hidden></div>
    <div class="notice" id="notice" hidden></div>
    <form class="composer" id="composer" autocomplete="off">
      <ol class="notes" id="notes" hidden></ol>
      <div class="about" id="about" hidden></div>
      <div class="box">
        <textarea id="input" rows="1" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit">Send</button>
      </div>
    </form>
    </div>
  </aside>

</div>
<script src="/__truemap/workspace.js"></script>
</body>
</html>
