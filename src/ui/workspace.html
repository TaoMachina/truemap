<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>truemap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Cpath d=%27M10 2.2 15.6 17.6 10 14.4 4.4 17.6z%27 fill=%27%23fff%27 stroke=%27%2317202b%27 stroke-width=%271.5%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M10 2.2V14.4L4.4 17.6z%27 fill=%27%232453c4%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/__truemap/workspace.css">
<script>window.TRUEMAP_TOKEN = "__TRUEMAP_TOKEN__"; window.TRUEMAP_CONTENT = "__TRUEMAP_CONTENT__";</script>
</head>
<body>
<div class="app" id="app" data-conn="live">

  <header class="bar">
    <div class="brand" title="truemap">
      <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><path class="mark-line" d="M10 2.2 15.6 17.6 10 14.4 4.4 17.6z"/><path class="mark-fill" d="M10 2.2V14.4L4.4 17.6z"/></svg>
      <span class="wordmark">truemap</span>
    </div>
    <span class="slash" aria-hidden="true">/</span>
    <div class="switcher">
      <button class="page-btn" id="pageBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Pages (Ctrl+K)">
        <span class="page-name" id="pageTitle">No pages yet</span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <div class="menu-head"><span id="project"></span><input id="filter" type="search" placeholder="Find a page" autocomplete="off" hidden></div>
        <div class="menu-list" id="pages"></div>
        <div class="menu-foot"><button class="text-btn" id="recheck" type="button">Check pages against the code</button><span id="ver"></span></div>
      </div>
    </div>
    <span class="path" id="pagePath"></span>
    <span class="spacer"></span>
    <button class="check" id="checkChip" type="button" hidden><i aria-hidden="true"></i><span id="checkText"></span></button>
    <button class="annotate" id="annotate" type="button" role="switch" aria-checked="false" title="Annotate (A)">
      <span>Annotate</span><span class="track" aria-hidden="true"><span class="thumb"></span></span>
    </button>
    <button class="icon-btn" id="togglePanel" type="button" aria-pressed="true" aria-controls="panel" title="Hide conversation">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="2"/><path d="M12.25 3.75v12.5"/><path class="panel-fill" d="M12.25 4.5h4.25v11h-4.25z"/></svg>
      <span class="unread" id="unread" hidden></span>
    </button>
  </header>

  <main class="stage">
    <iframe id="frame" title="Page" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
    <section class="empty" id="empty" hidden>
      <svg class="empty-mark" viewBox="0 0 20 20" aria-hidden="true"><path class="mark-line" d="M10 2.2 15.6 17.6 10 14.4 4.4 17.6z"/><path class="mark-fill" d="M10 2.2V14.4L4.4 17.6z"/></svg>
      <h1>No map of this project yet</h1>
      <p>Ask the agent to read the code and draw the blueprint. Every box on it points to real code, and truemap tells you when the code moves on.</p>
      <button class="primary" id="drawBlueprint" type="button">Ask the agent for a blueprint</button>
    </section>
  </main>

  <aside class="panel" id="panel" aria-label="Conversation">
    <div class="panel-head">
      <span class="agent-state" id="agent" data-state="offline"><i aria-hidden="true"></i><span id="agentLabel">No agent listening</span></span>
      <span class="elapsed" id="elapsed" hidden></span>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="notice" id="notice" hidden></div>
    <form class="composer" id="composer" autocomplete="off">
      <ol class="notes" id="notes" hidden></ol>
      <div class="box">
        <textarea id="input" rows="1" aria-label="Message"></textarea>
        <div class="box-foot">
          <span class="box-hint" id="boxHint">Enter to send</span>
          <button class="send" id="send" type="submit">Send</button>
        </div>
      </div>
    </form>
  </aside>

</div>
<script src="/__truemap/workspace.js"></script>
</body>
</html>
